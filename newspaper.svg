<svg xmlns="http://www.w3.org/2000/svg" width="486" height="479" viewBox="0 0 486 479" font-family="Georgia, 'Times New Roman', Times, serif" fill="#1a1a1a"><rect width="486" height="479" fill="#f4f1ea"/><text x="243.0" y="51.6" font-size="42" text-anchor="middle" font-weight="bold" font-style="normal" letter-spacing="4">THE DAILY COMMIT</text><line x1="18" y1="72.6" x2="468" y2="72.6" stroke="#1a1a1a" stroke-width="1"/><line x1="18" y1="75.6" x2="468" y2="75.6" stroke="#1a1a1a" stroke-width="1"/><text x="18.0" y="95.6" font-size="9" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="1.5">No. 301</text><text x="468.0" y="95.6" font-size="9" text-anchor="end" font-weight="normal" font-style="normal" letter-spacing="1.5">THU 30 JUL 2026</text><line x1="18" y1="101.6" x2="468" y2="101.6" stroke="#1a1a1a" stroke-width="0.5"/><text x="18.0" y="132.6" font-size="17" text-anchor="start" font-weight="bold" font-style="normal">BUN SHIPS BUN-V1.3.14</text><line x1="18" y1="153.6" x2="288" y2="153.6" stroke="#1a1a1a" stroke-width="0.5"/><text x="18.0" y="167.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">GitHub has released version 1.3.14 of the</text><text x="18.0" y="183.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">Bun JavaScript runtime, available for</text><text x="18.0" y="199.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">installation via a curl command or npm</text><text x="18.0" y="215.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">package, with upgrade instructions and</text><text x="18.0" y="231.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">release notes available on the official Bun</text><text x="18.0" y="247.6" font-size="11" text-anchor="start" font-weight="normal" font-style="italic">blog</text><text x="18.0" y="283.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">The latest update, which credits 11</text><text x="18.0" y="299.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" textLength="270.0" lengthAdjust="spacing">contributors, brings improvements to the</text><text x="18.0" y="315.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" textLength="270.0" lengthAdjust="spacing">platform, with users able to install the</text><text x="18.0" y="331.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">new version using a simple command or</text><text x="18.0" y="347.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">package manager, and upgrade existing</text><text x="18.0" y="363.6" font-size="12" text-anchor="start" font-weight="normal" font-style="normal">installations with a single command</text><text x="18.0" y="385.6" font-size="9" text-anchor="start" font-weight="normal" font-style="italic">— oven-sh/bun</text><text x="306.0" y="124.6" font-size="9" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">ALSO INSIDE</text><line x1="306" y1="130.6" x2="468" y2="130.6" stroke="#1a1a1a" stroke-width="0.5"/><text x="306.0" y="149.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">· Show HN: Open-source</text><text x="314.0" y="163.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">engine running Gemma 4</text><text x="314.0" y="177.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">26B in 2 GB RAM on any</text><text x="314.0" y="191.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">M-series Mac — 746 pts</text><text x="306.0" y="209.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">· Handbook.md shows that</text><text x="314.0" y="223.6" font-size="11" text-anchor="start" font-weight="normal" font-style="normal">long policy documents do</tex